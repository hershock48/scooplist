  <!--
    The Scooplist mark v3 - from Kevin's sketch (Aug 2026): big pink scoop
    with multicolored sprinkles, the GREEN goo from the glazedweb donut doing
    the melting (its exact gradients, back-drips, creep band, highlights,
    droplet, and dark accent - transplanted, not imitated), narrow brown
    cone underneath, drips hanging wider than the cone like the drawing.
    Pink and sheen are the logo's own. Mirror of src/components/Logo.tsx -
    keep them in sync.
  -->
