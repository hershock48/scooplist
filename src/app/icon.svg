  </g>

  <circle cx="32" cy="22" r="17" fill="url(#sp-pink)"/>

  <path d="M 17 30 A 17 17 0 0 0 47 30 C 46.3 28.7 45 28 43.7 28.7 C 42.4 29.6 42 31.2 40.7 31.9 C 38.7 32.5 37.7 29.9 35.7 29.3 C 33.7 28.6 33.4 31.2 31.7 32.2 C 30.1 32.8 29.1 30.6 27.1 29.6 C 25.1 28.9 24.5 30.6 22.9 31.2 C 21.2 31.5 19.9 30.6 17 30 Z" fill="url(#sp-creep)"/>
