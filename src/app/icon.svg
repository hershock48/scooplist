    <path d="M 29.4 31.8 C 29.1 40, 29.7 46.5, 30 51.8 C 30 55.8, 31 58.4, 33.2 58.7 C 35.4 58.4, 36.4 55.9, 35.8 52 C 36.1 45.5, 36.4 38.5, 36.6 31.8 Z"/>
