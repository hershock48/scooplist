<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The Scooplist mark v2 - built from the ACTUAL glazedweb logo
    (glazedweb/public/brand/logo.svg), not the simplified favicon. The scoop
    wears the donut icing's exact radial gradient and two-part sheen; the
    melt borrows the goo's full construction: dark back-drips for depth,
    three front drips with rounded bulbs, a lighter creep band along the
    scoop's lower arc, cream highlights down each drip, a droplet near the
    long drip's tip, and the dark accent curve. Same layer order as the
    original. Mirror of src/components/Logo.tsx - keep them in sync.
  -->
  <defs>
    <radialGradient id="sp-pink" cx="40%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#F887B2"/>
      <stop offset="55%" stop-color="#E84D8A"/>
      <stop offset="100%" stop-color="#CE3672"/>
    </radialGradient>
    <linearGradient id="sp-drip" x1="0" y1="31" x2="0" y2="59" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F887B2"/>
      <stop offset="55%" stop-color="#E84D8A"/>
      <stop offset="100%" stop-color="#CE3672"/>
    </linearGradient>
    <linearGradient id="sp-creep" x1="0" y1="28" x2="0" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBAFCB"/>
      <stop offset="100%" stop-color="#F27BAB"/>
    </linearGradient>
    <linearGradient id="sp-dark" x1="0" y1="31" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C22F6B"/>
      <stop offset="100%" stop-color="#992052"/>
    </linearGradient>
  </defs>

  <path d="M 18 33 L 46 33 L 32 61 Z" fill="#B98A4A"/>
  <path d="M 22 39 L 42 39 M 25 45 L 39 45 M 28 51 L 36 51 M 26 35 L 32 47 M 38 35 L 33 45" stroke="#8a6536" stroke-width="1.8" fill="none"/>

  <g fill="url(#sp-dark)">
