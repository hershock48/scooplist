    <path d="M 21.8 37.5 C 21.5 42.1, 22.1 46.7, 22.4 50" stroke-width="1.1" opacity="0.8"/>
    <path d="M 39.8 36.2 C 39.5 39.5, 40.2 44.1, 40.5 47.4" stroke-width="1.1" opacity="0.8"/>
