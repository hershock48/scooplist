<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The Scooplist mark v4 - from Kevin's sketch, at the glazedweb logo's own
    proportions this time: the goo creep sits LOW on the scoop and the three
    front drips are FAT (each ~21% of the scoop's width, like the donut's),
    so the goo owns the whole underside - no bare pink bulge below the melt
    line. Green goo construction is the logo's (gradients, dark back layer,
    creep band, cream highlights, droplet, dark accent). Narrow brown cone;
    outer drips overhang it like the sketch. Multicolored sprinkles clear of
    the sheen. Mirror of src/components/Logo.tsx - keep them in sync.
  -->
  <defs>
    <radialGradient id="sp-pink" cx="40%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#F887B2"/>
      <stop offset="55%" stop-color="#E84D8A"/>
      <stop offset="100%" stop-color="#CE3672"/>
    </radialGradient>
    <linearGradient id="sp-goo" x1="0" y1="26" x2="0" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D9EDA0"/>
      <stop offset="55%" stop-color="#BFE07A"/>
      <stop offset="100%" stop-color="#A3CE55"/>
    </linearGradient>
    <linearGradient id="sp-creep" x1="0" y1="23" x2="0" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E3F2B0"/>
      <stop offset="100%" stop-color="#C3E181"/>
    </linearGradient>
    <linearGradient id="sp-dark" x1="0" y1="26" x2="0" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5FA850"/>
      <stop offset="100%" stop-color="#43813A"/>
    </linearGradient>
  </defs>

  <path d="M 23.5 33 L 40.5 33 L 32 61 Z" fill="#B98A4A"/>
  <path d="M 26.2 40 L 37.8 40 M 27.8 45 L 36.2 45 M 29.4 50 L 34.6 50 M 26.8 36 L 31.6 52 M 37.2 36 L 32.4 52" stroke="#8a6536" stroke-width="1.4" fill="none"/>

